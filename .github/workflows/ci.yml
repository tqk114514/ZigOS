name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      # Fork of mlugg/setup-zig v2.2.1 with only the runtime changed to node24.
      # Revert to upstream once it ships a node24 release.
      - uses: tqk114514/setup-zig@v2.2.1-node24
        with:
          version: 0.17.0
      - name: Format
        run: zig fmt --check .
      - name: Host tests (Debug)
        run: zig build test
      - name: Host tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
      - name: Dependency DAG
        run: zig build check-deps
