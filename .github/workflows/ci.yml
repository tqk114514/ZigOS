name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Format
        run: zig fmt --check .
      - name: Host tests (Debug)
        run: zig build test
      - name: Host tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
      - name: Dependency DAG
        run: zig build check-deps
